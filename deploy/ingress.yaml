# Generated by pnpm gen:ingress from packages/routing/src/zones.ts
# Do not edit by hand. PathType Prefix is segment-aware in Kubernetes, so
# /ops matches /ops and /ops/x but not /opsx.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relay
  namespace: relay
  annotations:
    # Identity is enforced at the cluster edge, not by the shell. Replace these
    # with the platform's forward-auth or oauth2-proxy configuration.
    # nginx.ingress.kubernetes.io/auth-url: "https://sso.example.com/oauth2/auth"
    # nginx.ingress.kubernetes.io/auth-signin: "https://sso.example.com/oauth2/start?rd=$scheme://$host$request_uri"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  rules:
    - host: relay.example.com
      http:
        paths:
          # Catalog zone
          - path: /catalog
            pathType: Prefix
            backend:
              service:
                name: relay-catalog
                port:
                  number: 80
          # immutable build output
          - path: /_assets/catalog
            pathType: Prefix
            backend:
              service:
                name: relay-catalog
                port:
                  number: 80
          # Operations zone
          - path: /ops
            pathType: Prefix
            backend:
              service:
                name: relay-ops
                port:
                  number: 80
          # immutable build output
          - path: /_assets/ops
            pathType: Prefix
            backend:
              service:
                name: relay-ops
                port:
                  number: 80
          # Insights zone
          - path: /reports
            pathType: Prefix
            backend:
              service:
                name: relay-reports
                port:
                  number: 80
          # relay-mock-api
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: relay-mock-api
                port:
                  number: 80
          # shell catches the rest
          - path: /
            pathType: Prefix
            backend:
              service:
                name: relay-shell
                port:
                  number: 80
  # tls:
